name: run-shadow-buyhold

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-buyhold
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python run_shadow_buyhold.py

      - name: Commit updated buy-and-hold log
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add shadow_buyhold_log.csv
          git diff --staged --quiet || git commit -m "Update buy-and-hold shadow log $(date +'%Y-%m-%d')"
          git push
